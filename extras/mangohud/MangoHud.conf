# MangoHud — fynnp desk session reports (owned by desk-widgets agent "session").
# Loaded only for Steam games: Steam is started with MANGOHUD=1 via
# ~/.local/share/applications/steam.desktop (Vulkan layer; DXVK/VKD3D/Proton + native Vulkan).
# Option names verified against MangoHud 0.8.4 (/usr/share/doc/mangohud/MangoHud.conf.example).

########## HUD ##########
# Hidden by default. Toggle the in-game overlay with Right-Shift + F12.
no_display
toggle_hud=Shift_R+F12
# Logging is automatic; this key stops/starts a log manually (each log = one session report).
toggle_logging=Shift_L+F2

# Metrics shown when toggled on. cpu_temp/cpu_power/gpu_temp/gpu_power are also
# what makes MangoHud *sample* those values, so the log columns are filled.
fps
frametime
gpu_stats
gpu_temp
gpu_power
cpu_stats
cpu_temp
cpu_power

########## LOG ##########
# Start logging 1 s after the game's first frame; runs until the game exits.
autostart_log=1
# One CSV row every 100 ms (10 Hz): ~6 MB per 2 h, negligible overhead.
log_interval=100
output_folder=@HOME@/.local/state/fynnp-desk/mangohud-logs
permit_upload=0
